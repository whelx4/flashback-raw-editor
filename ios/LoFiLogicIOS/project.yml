name: LoFiLogic
options:
  bundleIdPrefix: com.lofilogic
  deploymentTarget:
    iOS: "17.0"
targets:
  LoFiLogic:
    type: application
    platform: iOS
    sources:
      - App
      - Models
      - Services
      - Views
      - path: ../../shared/presets.json
        buildPhase: resources
      - path: ../../assets/luts
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lofilogic.ios
        PRODUCT_NAME: LoFi Logic
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.9
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LoFi Logic
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Choose Sony P43 and other compact-camera photos to edit."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Save your finished LoFi Logic JPEGs to Photos."
