name: LoFiLogic
options:
  bundleIdPrefix: com.lofilogic
  deploymentTarget:
    iOS: "17.0"
targets:
  LoFiLogic:
    type: application
    platform: iOS
    sources:
      - App
      - Models
      - Services
      - Views
    resources:
      - path: ../../shared/presets.json
      - path: ../../assets/luts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lofilogic.ios
        PRODUCT_NAME: LoFi Logic
        SWIFT_VERSION: 5.9
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LoFi Logic
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        TARGETED_DEVICE_FAMILY: 1
